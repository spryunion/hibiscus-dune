<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact — Altus 9</title>
	<meta name="description" content="Contact Altus 9 to discuss AI and consulting engagements.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/styles.css">
	<link rel="icon" href="/assets/images/favicon.png">
</head>
<body>
	<header class="site-header">
		<div class="container">
			<a class="logo" href="/">Altus<span>9</span></a>
			<nav class="nav" id="nav">
				<a href="/services.html">Services</a>
				<a href="/ai.html">AI</a>
				<a href="/podcast.html">Podcast</a>
				<a href="/about.html">About</a>
				<a class="btn btn-primary" href="/contact.html" aria-current="page">Contact</a>
			</nav>
			<button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
		</div>
	</header>
	<main>
		<section class="hero">
			<div class="container">
				<h1>Contact</h1>
				<p>Tell us about your goals. We’ll propose a pragmatic path forward.</p>
			</div>
		</section>
		<section class="highlights">
			<div class="container">
				<form action="https://formspree.io/f/xdknynyp" method="POST" class="contact-form" style="display:grid;gap:12px;max-width:640px;">
					<label>
						<span>Name</span>
						<input name="name" required type="text" placeholder="Jane Doe" />
					</label>
					<label>
						<span>Email</span>
						<input name="email" required type="email" placeholder="jane@company.com" />
					</label>
					<label>
						<span>Company</span>
						<input name="company" type="text" placeholder="Company Inc." />
					</label>
					<label>
						<span>How can we help?</span>
						<textarea name="message" required rows="5" placeholder="Briefly describe your goals and timeline"></textarea>
					</label>
					<div>
						<button class="btn btn-primary" type="submit">Send</button>
						<a class="btn" href="mailto:hello@altus9.com">Email instead</a>
					</div>
				</form>
			</div>
		</section>
	</main>
	<footer class="site-footer">
		<div class="container">
			<p>© <span id="year"></span> Altus 9. All rights reserved.</p>
		</div>
	</footer>
	<script src="/assets/js/main.js"></script>
</body>
</html>
